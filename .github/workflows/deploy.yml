name: Deploy Conversation Lab

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conversation-lab-deployment
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepare assets and validate
        run: |
          node scripts/build-datasets.mjs --check
          node scripts/build-web.mjs
          node --check web/app.js
          node --test
      - name: Deploy page and anonymous API
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: web
          api_location: api
          output_location: ""
          skip_app_build: true
